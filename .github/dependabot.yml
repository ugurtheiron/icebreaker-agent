version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    # Minor and patch updates arrive in one grouped pull request. Major
    # version bumps get a separate one so they can be tested on their own;
    # the LangChain packages are pinned together, so their majors still
    # arrive together.
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # Actions are pinned to major tags, so every update here is a major one.
    groups:
      github-actions:
        patterns:
          - "*"
