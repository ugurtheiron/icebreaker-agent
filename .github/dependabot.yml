version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    # The LangChain packages are pinned against each other, and some of their
    # minor releases need a new langchain-core major, so splitting them by
    # update type gives pull requests that cannot resolve. They get a group
    # of their own, whatever the update type. For everything else, minor and
    # patch updates arrive in one pull request and majors in another.
    groups:
      langchain:
        patterns: ["langchain*"]
      python-minor-patch:
        exclude-patterns: ["langchain*"]
        update-types: ["minor", "patch"]
      python-major:
        exclude-patterns: ["langchain*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # Actions are pinned to major tags, so every update here is a major one.
    groups:
      github-actions:
        patterns:
          - "*"
